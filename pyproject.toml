[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-multiscene-shortcuts"
dynamic = ["version"]
description = "Switch the OBS main canvas and the Aitum Vertical Canvas together from one keyboard shortcut"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mitchell Hoover" }]
requires-python = ">=3.11"
dependencies = [
    "obsws-python",
    "websocket-client",
]

[project.urls]
Homepage = "https://github.com/FluffCycle/obs-multiscene-shortcuts"
Repository = "https://github.com/FluffCycle/obs-multiscene-shortcuts"
Issues = "https://github.com/FluffCycle/obs-multiscene-shortcuts/issues"

[project.optional-dependencies]
# Prefer your distro's PySide6 package so the editor matches your desktop theme (see README).
gui = ["PySide6"]

[project.scripts]
obs-multiscene = "obs_multiscene_shortcuts.cli:main"

[project.gui-scripts]
obs-multiscene-config = "obs_multiscene_shortcuts.gui:main"

[tool.setuptools]
packages = ["obs_multiscene_shortcuts"]

[tool.setuptools_scm]
# Version comes from the latest vX.Y.Z git tag; .git_archival.txt covers source archives.

[tool.setuptools.package-data]
obs_multiscene_shortcuts = ["*.desktop"]
